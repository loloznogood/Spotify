version: '3.8'
services:
  app:
    build:
      context: ./
    container_name: spotify
    ports:
      - "8000:8000"
    volumes:
      - ./:/var/www
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=spotify
      - DB_USERNAME=spotify
      - DB_PASSWORD=spotify
      
  db:
    image: mysql:8.0
    container_name: spotify_db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: spotify
      MYSQL_USER: spotify
      MYSQL_PASSWORD: spotify
    volumes:
      - db_data:/var/lib/mysql
      
  node:
    image: node:18-alpine
    working_dir: /var/www
    volumes:
      - ./:/var/www
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=1000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    
volumes:
  db_data: