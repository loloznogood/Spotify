name: Local Laravel CI

on:
  push:
    branches:
      - dev
      - staging
      - preprod
      - main
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - dev
      - staging
      - preprod
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: spotify
          MYSQL_USER: spotify
          MYSQL_PASSWORD: spotify
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Compose
        env:
          CI: true
          APP_ENV: testing
        run: docker compose up --build -d app

      - name: Run Laravel tests
        run: docker compose run --rm -e CI=true app php artisan test

      - name: Clean up containers
        run: docker compose down -v