name: Local Laravel CI

on:
  push:
    branches:
      - dev
      - staging
      - preprod
      - main
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - dev
      - staging
      - preprod
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: spotify
          MYSQL_USER: spotify
          MYSQL_PASSWORD: spotify
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Compose
        run: docker compose build app

      - name: Wait for MySQL to be ready
        run: |
          echo "Waiting for MySQL to be healthy..."
          while ! docker exec $(docker ps -qf "ancestor=mysql:8.0") mysqladmin ping -h "localhost" --silent; do
            sleep 5
          done

      - name: Run Laravel tests
        run: docker compose run --rm app php artisan test