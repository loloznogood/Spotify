name: Local Laravel CI

on:
  push:
    branches:
      - dev
      - staging
      - preprod
      - main
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - dev
      - staging
      - preprod
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: spotify
          MYSQL_USER: spotify
          MYSQL_PASSWORD: spotify
        volumes:
          - db_data:/var/lib/mysql
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Compose
        run: docker compose up -d --build

      - name: Wait for Laravel to boot
        run: sleep 10

      - name: Run Laravel tests
        run: docker compose exec -T spotify:test php artisan test

      - name: Shutdown
        run: docker compose down
